name: 문서 개선
description: 실제 구현과 문서의 차이를 해결한다.
title: '[documentation] '
body:
- type: markdown
  attributes:
    value: 비밀·개인정보·실거래 자료를 첨부하지 마세요. 사실·가정·미검증 항목을 구분해 작성하세요.
- type: textarea
  id: problem
  attributes:
    label: 대상 문서·잘못되거나 누락된 내용
    description: 현재 상태와 근거를 구체적으로 기록하세요.
  validations:
    required: true
- type: textarea
  id: outcome
  attributes:
    label: 올바른 설명·공식 근거·확인 날짜
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: 수락 기준과 검증 방법
    description: 관찰 가능한 완료 조건과 테스트·측정 명령을 적으세요.
  validations:
    required: true
- type: textarea
  id: scope
  attributes:
    label: 범위·제외 범위·플랫폼·의존성
  validations:
    required: true
- type: textarea
  id: risks
  attributes:
    label: 보안·데이터·성능 위험과 복구 방법
