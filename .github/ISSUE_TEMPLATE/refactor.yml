name: 리팩터링
description: 동작을 보존하며 구조를 개선한다.
title: '[refactor] '
body:
- type: markdown
  attributes:
    value: 비밀·개인정보·실거래 자료를 첨부하지 마세요. 사실·가정·미검증 항목을 구분해 작성하세요.
- type: textarea
  id: problem
  attributes:
    label: 현재 구조의 문제와 변경 근거
    description: 현재 상태와 근거를 구체적으로 기록하세요.
  validations:
    required: true
- type: textarea
  id: outcome
  attributes:
    label: 보존할 동작·호환성·점진 전환 방법
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: 수락 기준과 검증 방법
    description: 관찰 가능한 완료 조건과 테스트·측정 명령을 적으세요.
  validations:
    required: true
- type: textarea
  id: scope
  attributes:
    label: 범위·제외 범위·플랫폼·의존성
  validations:
    required: true
- type: textarea
  id: risks
  attributes:
    label: 보안·데이터·성능 위험과 복구 방법
