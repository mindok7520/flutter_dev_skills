name: Material quality

on:
  push:
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.13']
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
  dart-tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Download the standalone Dart SDK used to validate tooling
        env:
          DART_VERSION: '3.13.2'
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, shutil, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'dart-tooling'
          root.mkdir()
          url = 'https://storage.googleapis.com/dart-archive/channels/stable/release/' + os.environ['DART_VERSION'] + '/sdk/dartsdk-linux-x64-release.zip'
          with urllib.request.urlopen(url + '.sha256sum', timeout=30) as response:
              expected = response.read(4096).decode().split()[0]
          archive = root / 'sdk.zip'
          with urllib.request.urlopen(url, timeout=60) as response, archive.open('xb') as output:
              shutil.copyfileobj(response, output)
          with archive.open('rb') as content:
              actual = hashlib.file_digest(content, 'sha256').hexdigest()
          if actual != expected:
              raise SystemExit('Dart SDK checksum mismatch')
          PY
          unzip -q "$RUNNER_TEMP/dart-tooling/sdk.zip" -d "$RUNNER_TEMP/dart-tooling"
      - name: Analyze tools and test command dispatch without building a Flutter app
        env:
          DART_EXECUTABLE: ${{ runner.temp }}/dart-tooling/dart-sdk/bin/dart
        run: python -m unittest discover -s tests -p test_dart_tooling.py -v
